name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      # Integration tests need the relate binary; they are skipped without it.
      - name: Install relate (Linux, macOS)
        if: runner.os != 'Windows'
        continue-on-error: true
        run: |
          curl -sSfL https://relatedb.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install relate (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          irm https://relatedb.ai/install.ps1 | iex
          "$env:LOCALAPPDATA\Programs\relate" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Test
        run: uv run --no-project --python ${{ matrix.python }} --with pytest --with-editable . pytest -q
