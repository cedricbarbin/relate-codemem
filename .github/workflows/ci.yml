name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      # Integration tests need the relate binary; they are skipped without it.
      - name: Install relate (Linux, macOS)
        if: runner.os != 'Windows'
        continue-on-error: true
        run: |
          curl -sSfL https://relatedb.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install relate (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          irm https://relatedb.ai/install.ps1 | iex
          "$env:LOCALAPPDATA\Programs\relate" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Test
        run: uv run --no-project --python ${{ matrix.python }} --with pytest --with-editable . pytest -q
