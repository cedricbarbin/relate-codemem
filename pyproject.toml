[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "relate-codemem"
version = "0.2.0"
description = "Long-term project memory for Claude Code on the relate embedded graph database: code index with hashes and revisions, docs, decisions, meetings and sessions, with hybrid search."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["claude-code", "agent-memory", "graph-database", "relate", "cypher", "graphrag", "code-index"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/cedricbarbin/relate-codemem"
Repository = "https://github.com/cedricbarbin/relate-codemem"
Documentation = "https://github.com/cedricbarbin/relate-codemem/tree/main/docs"
Issues = "https://github.com/cedricbarbin/relate-codemem/issues"
Changelog = "https://github.com/cedricbarbin/relate-codemem/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Local embeddings (no service, no API key). Other providers need no extra.
local = ["fastembed>=0.4"]
parse = ["tree-sitter-language-pack>=1.25,<2; python_version >= '3.11'"]
dev = ["pytest>=8"]

[project.scripts]
relate-codemem = "relate_codemem.cli:main"
rcm = "relate_codemem.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/relate_codemem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
